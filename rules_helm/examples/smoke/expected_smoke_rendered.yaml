# Source: smoke/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-release
  namespace: smoke-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke
  template:
    metadata:
      labels:
        app: smoke
    spec:
      containers:
        - name: smoke
          image: "nginx:latest"
