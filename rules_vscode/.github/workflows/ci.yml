name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bazel test //...
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.10.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true
      - run: bazel test //... --test_output=errors

  buildifier:
    name: buildifier lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install buildifier
        run: |
          curl -fsSL -o /usr/local/bin/buildifier \
            https://github.com/bazelbuild/buildtools/releases/download/v7.3.1/buildifier-linux-amd64
          chmod +x /usr/local/bin/buildifier
      # Scoped to the hand-written sources rather than `-r .`.
      #
      # schema/code_workspace.bzl is "@generated by
      # rules_jsonschema//tools/schema_to_starlark. DO NOT EDIT." and does not
      # satisfy the lint: no module docstring, and it loads
      # `parse_json_or_none` without using it. Both are the generator's output
      # style, not a defect a reader of this repo can fix — editing the file to
      # appease the linter would be reverted by the next refresh, and its
      # diff_test would then fail instead.
      #
      # So the lint covers what a human writes here, and the generated file is
      # the generator's problem. The real fix belongs upstream in
      # rules_jsonschema (emit a module docstring; only load what is used);
      # when that lands, this can go back to `-r .`.
      - run: buildifier --mode=check --lint=warn -r vscode examples MODULE.bazel BUILD.bazel
