[workspace]
resolver = "2"
members = ["server"]

[workspace.package]
edition = "2021"
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/fastverk/rules_ssh_tui"

[workspace.dependencies]
russh = "0.45"
russh-keys = "0.45"
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
# russh 0.45's `Handler` trait is `#[async_trait]`-erased — impls
# must use the same macro to land matching lifetime bounds, else
# rustc complains about lifetime parameter mismatch.
async-trait = "0.1"
# Cross-platform PTY (Linux + macOS). For the container build we
# really only need Linux, but using portable-pty keeps dev-loop
# `cargo run` working on the host (e.g. macOS).
portable-pty = "0.8"
bytes = "1.7"
